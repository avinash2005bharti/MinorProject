# ==============================================================================
# CampusFlow / CSE Department ERP - Render Blueprint Configuration
# ==============================================================================
# Infrastructure definition for deploying the complete College ERP to Render:
# 1. Managed Render PostgreSQL Database (Relational ERP source of truth)
# 2. Node.js Express API Gateway (Backend with automated schema migration)
# 3. Python FastAPI Microservice (AI Timetable Agent, LLM reasoning, RAG)
# 4. React Vite Frontend (Static site for browser clients)
# ==============================================================================

databases:
  - name: cse-erp-postgres
    databaseName: cse_erp
    user: cse_user
    plan: starter # Render managed PostgreSQL
    ipAllowList: [] # Accessible by Render services; configure external IP access in Render dashboard if needed

services:
  # ----------------------------------------------------------------------------
  # 1. Node.js Express Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: cse-erp-backend
    env: node
    rootDir: backend
    plan: starter
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: cse-erp-postgres
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: USE_POSTGRES
        value: "true"
      - key: MONGODB_URI
        sync: false # Set via Render Dashboard (e.g. MongoDB Atlas URI)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PYTHON_AI_SERVICE_URL
        fromService:
          type: web
          name: cse-erp-ai-service
          property: host
      - key: CORS_ORIGIN
        value: "*"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Python FastAPI AI Microservice Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: cse-erp-ai-service
    env: python
    rootDir: ai-service
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cse-erp-postgres
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: MONGODB_URI
        sync: false # Set via Render Dashboard (e.g. MongoDB Atlas URI)
      - key: GROQ_API_KEY
        sync: false # Set via Render Dashboard
      - key: QDRANT_URL
        sync: false # Set via Render Dashboard
      - key: QDRANT_API_KEY
        sync: false # Set via Render Dashboard

  # ----------------------------------------------------------------------------
  # 3. React Vite Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: cse-erp-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cse-erp-backend
          property: host

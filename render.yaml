# OIST CSE: React static site -> Node.js API -> FastAPI AI service.
# PostgreSQL is provisioned on Render. MongoDB and Qdrant are external
# managed services; provide their connection details in the Render Dashboard.

databases:
  - name: oistcse-postgres
    databaseName: cse_erp
    user: cse_user
    plan: basic-1gb
    ipAllowList: []

envVarGroups:
  - name: oistcse-internal
    envVars:
      - key: INTERNAL_API_SECRET
        generateValue: true

services:
  - type: web
    name: oistcse-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci && npx prisma generate --schema=src/models/postgres/schema.prisma
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - fromGroup: oistcse-internal
      - key: NODE_ENV
        value: production
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: oistcse-postgres
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_REGISTRATION_SECRET
        generateValue: true
      - key: PYTHON_AI_SERVICE_URL
        value: http://oistcse-ai:10000
      - key: AI_SERVICE_URL
        value: http://oistcse-ai:10000
      - key: BACKEND_URL
        value: https://oistcse-backend.onrender.com
      - key: FRONTEND_URL
        value: https://oistcse.onrender.com
      - key: CORS_ORIGINS
        value: https://oistcse.onrender.com
      - key: UPLOAD_PATH
        value: /var/data/uploads
    disk:
      name: oistcse-uploads
      mountPath: /var/data
      sizeGB: 1

  - type: pserv
    name: oistcse-ai
    runtime: python
    rootDir: ai-service
    plan: starter
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - fromGroup: oistcse-internal
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CARGO_HOME
        value: /tmp/cargo
      - key: DATABASE_URL
        fromDatabase:
          name: oistcse-postgres
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NODE_BACKEND_URL
        value: http://oistcse-backend:10000
      - key: BACKEND_URL
        value: http://oistcse-backend:10000
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: oistcse
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://oistcse-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

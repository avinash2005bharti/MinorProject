# CampusFlow: React static site -> Node.js API -> FastAPI AI service.
# PostgreSQL is provisioned on Render. MongoDB and Qdrant are external
# managed services; provide their connection details in the Render Dashboard.

databases:
  - name: cse-erp-postgres
    databaseName: cse_erp
    user: cse_user
    plan: basic-1gb
    ipAllowList: []

envVarGroups:
  - name: campusflow-internal
    envVars:
      - key: INTERNAL_API_SECRET
        generateValue: true

services:
  - type: web
    name: cse-erp-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci && npx prisma generate --schema=src/models/postgres/schema.prisma
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVarGroups:
      - campusflow-internal
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cse-erp-postgres
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_REGISTRATION_SECRET
        generateValue: true
      - key: PYTHON_AI_SERVICE_URL
        value: http://cse-erp-ai-service:10000
      - key: BACKEND_URL
        value: https://cse-erp-backend.onrender.com
      - key: CORS_ORIGINS
        value: https://cse-erp-frontend.onrender.com
      - key: UPLOAD_PATH
        value: /opt/render/project/src/backend/uploads
    disk:
      name: campusflow-uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1

  - type: pserv
    name: cse-erp-ai-service
    runtime: python
    rootDir: ai-service
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVarGroups:
      - campusflow-internal
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: cse-erp-postgres
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NODE_BACKEND_URL
        value: http://cse-erp-backend:10000
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: cse-erp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cse-erp-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

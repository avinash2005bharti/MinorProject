version: '3.8'

services:
  backend:
    build: .
    container_name: campusflow_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/campusflow
      - JWT_SECRET=campusflow_super_secret_jwt_key_cse_dept_2025_secure
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongo
    volumes:
      - uploads_data:/app/uploads

  mongo:
    image: mongo:6.0
    container_name: campusflow_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  uploads_data:
